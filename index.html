    const CHIPN = [["Eq. 4.13", "Eq 4.13 Tear-out"], ["Eq. 4.14", "Eq 4.14 Contact"], ["Eq. 4.15", "Eq 4.15 Cheek weld"], ["Base", "Base"],
      ["Hole clears", "Hole clears pin"], ["Hole clearance", "Hole clearance"], ["Thickness fits", "Jaw fit t+2tc<=A"], ["Thickness >=", "t>=0.75A"],
      ["Thimble", "Thimble"], ["Bow gap", "Bow gap"], ["R within", "R range"], ["Cheek radius", "Rc<=R"], ["Sling in line", "Sling in line"]];
    const chipName = (n) => (CHIPN.find(([p]) => n.startsWith(p)) || [0, n])[1];
    function ucRows() {
      const out = [], N = (x) => Number(x);
      const add = (name, res, lim, uc, ok) => out.push({ name, res, lim, uc, ok });
      const ls = mode === "design" ? (designed ? designed.ls : null) : checkLs;
      if (score && !score.block) {
        (score.rows || []).forEach((r) => add(chipName(r.name), fmt(r.value, 3), fmt(r.limit, 3), r.util, r.ok));
      }
      if (ls) {
        if (ls.leg) add("Rope WLL, lb", fmt(ls.leg.util * ls.leg.wll_lb, 0), fmt(ls.leg.wll_lb, 0), ls.leg.util, ls.leg.util <= 1);
        if (ls.master_link) { add("Master link WLL, lb", fmt(ls.master_link.util * ls.master_link.wll_lb, 0), fmt(ls.master_link.wll_lb, 0), ls.master_link.util, ls.master_link.util <= 1);
          add("Master link inside", "", "", null, !!ls.master_link.inside_ok); }
        if (ls.forerunner) add("Forerunner WLL, lb", fmt(ls.forerunner.util * ls.forerunner.wll_lb, 0), fmt(ls.forerunner.wll_lb, 0), ls.forerunner.util, ls.forerunner.util <= 1);
        if (ls.shackle) add("Shackle WLL, t", fmt(ls.wll_req_t, 3), fmt(ls.shackle.wll_dnv, 3), ls.shackle.utilisation, ls.shackle.utilisation <= 1);
      }
      if (score && score.fits) score.fits.forEach((f) => {
        const t = f.text || "", m = (re) => t.match(re);
        let res = "", lim = "", uc = null, k;
        if ((k = m(/^Dh ([\d.]+) >= ([\d.]+)/))) { res = k[1]; lim = "≥ " + k[2]; uc = N(k[2]) / N(k[1]); }
        else if ((k = m(/^Dh ([\d.]+) <= ([\d.]+)/))) { res = k[1]; lim = "≤ " + k[2]; uc = N(k[1]) / N(k[2]); }
        else if ((k = m(/= ([\d.]+) <= A ([\d.]+)/))) { res = k[1]; lim = "≤ " + k[2]; uc = N(k[1]) / N(k[2]); }
        else if ((k = m(/= ([\d.]+) >= 0.75 A = ([\d.]+)/))) { res = k[1]; lim = "≥ " + k[2]; uc = N(k[2]) / N(k[1]); }
        else if ((k = m(/Gap_min ([-\d.]+) >= tolerance ([\d.]+)/))) { res = k[1]; lim = "≥ " + k[2]; uc = N(k[1]) > 0 ? N(k[2]) / N(k[1]) : (N(k[2]) > 0 || N(k[1]) < 0 ? Infinity : 0); }
        else if ((k = m(/R_min ([\d.]+).*<= R ([\d.]+).*<= R_max ([-\d.]+)/))) { res = k[2]; lim = k[1] + "–" + k[3]; uc = Math.max(N(k[1]) / N(k[2]), N(k[3]) > 0 ? N(k[2]) / N(k[3]) : Infinity); }
        else if ((k = m(/^Rc ([\d.]+) <= R ([\d.]+)/))) { res = k[1]; lim = "≤ " + k[2]; uc = N(k[1]) / N(k[2]); }
        else if ((k = m(/bow dia D ([\d.]+) <= thimble D ([\d.]+); thimble width E ([\d.]+) <= bow inside E ([\d.]+)/))) { res = "D " + k[1] + " E " + k[3]; lim = "D " + k[2] + " E " + k[4]; uc = Math.max(N(k[1]) / N(k[2]), N(k[3]) / N(k[4])); }
        else if ((k = m(/sling ([\d.]+) deg.*<= ([\d.]+)/))) { res = k[1]; lim = "≤ " + k[2]; uc = N(k[1]) / N(k[2]); }
        else if (/no cheek/.test(t)) return;
        else res = t;
        add(chipName(f.name), res, lim, uc, f.ok);
      });
      return out;
    }
    function paintUC() {
      const rows = ucRows();
      let gi = -1, gv = -Infinity;
      rows.forEach((r, i) => { if (r.uc !== null && Number.isFinite(r.uc) ? r.uc > gv : (r.uc === Infinity && gv < Infinity)) { gv = r.uc; gi = i; } });
      const u = (x) => x === null ? "" : Number.isFinite(x) ? x.toFixed(3) : "∞";
      const html = rows.length ? `<h2>Checks</h2><table><colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"></colgroup>
        <tr><th>Check</th><th>Result</th><th>Limit</th><th>Util</th><th>Status</th></tr>` +
        rows.map((r, i) => `<tr class="${i === gi ? "gov" : ""}"><td title="${esc(r.name)}">${esc(r.name)}</td><td title="${esc(String(r.res))}">${esc(String(r.res))}</td><td title="${esc(String(r.lim))}">${esc(String(r.lim))}</td><td class="${r.uc > 1 ? "r" : ""}">${u(r.uc)}</td><td class="${r.ok ? "g" : "r"}">${r.ok ? "PASS" : "FAIL"}</td></tr>`).join("") + "</table>" : "";
      document.getElementById("ucL").innerHTML = html; document.getElementById("ucR").innerHTML = html;
      return gi >= 0 ? rows[gi] : null;
    }
    function paintGov() {
      const g = paintUC(), st = document.getElementById("stats");
      if (false) st.insertAdjacentHTML("beforeend", `<div class="stat${g.uc > 1 ? " bad" : ""}"><b>${Number.isFinite(g.uc) ? g.uc.toFixed(3) : "∞"}</b><span>Governing UC: ${esc(g.name)}</span></div>`);
    }
    function paintChips() {
      const h = document.getElementById("chips");
      if (!score || score.block) { h.innerHTML = ""; return; }
      const c = (n, v, ok) => `<span class="chip${ok ? "" : " bad"}" title="${esc(n)}">${esc(chipName(n))} ${v} ${ok ? "PASS" : "FAIL"}</span>`;
      h.innerHTML = (score.rows || []).map((r) => c(r.name, fmt(r.util, 3), r.ok)).join("") +
        (score.fits || []).map((f) => c(f.name, "", f.ok)).join("");
    }

    function highlight() {
      document.querySelectorAll("[data-mark]").forEach(el => el.classList.toggle("on", el.dataset.mark === mark));
      const sh = score && score.shackle ? score.shackle : {};
      const setVal = (id, v) => { const el = document.querySelector(`[data-val="${id}"]`); if (el) el.textContent = v; };
      if (sh.A != null) setVal("jawA", fmt(sh.A, 3));
      if (sh.B != null) setVal("pinB", fmt(sh.B, 3));
      if (sh.C != null) setVal("lenC", fmt(sh.C, 3));
    }
    function shackleFig() {
      let name = inputs.shackle || "";
      if ((!name || name === "auto") && score && score.shackle) name = `${score.shackle.type} ${score.shackle.size}`;
      const sp = name.indexOf(" ");
      const r = sp > 0 ? (PadEye.SHACKLES[name.slice(0, sp)] || {})[name.slice(sp + 1)] : null;
      document.getElementById("shkTitle").textContent = r ? `Shackle ${name}` : "Shackle";
      const host = document.getElementById("shk");
      if (!r) { host.innerHTML = ""; return; }
      const keys = ["A", "B", "C", "D", "E"].filter((k) => r[k] != null);
      const rows = keys.map((k) => `<tr><th>${k}</th><td class="num">${fmt(r[k], 3)} in</td></tr>`).join("");
      host.innerHTML = `<div class="shkfig">
        <div class="shkimgwrap"><img src="g2130_drawing.png" alt="Crosby G-2130 bolt type anchor shackle dimension drawing" width="168" height="382"></div>
        <div class="shkdims">
          <table><tbody>${rows}</tbody></table>
          <p class="shkcap">Drawing: Crosby G-2130 catalog</p>
        </div>
      </div>`;
    }
    function paintViews() { highlight(); shackleFig(); front(); side(); postSketch(); bow(); tables(); }

    function commit() {
      if (mode === "check") { refreshAll(false); return; }
      score = doScore(inputs);
      paintViews();
    }

    document.getElementById("form").addEventListener("click", (event) => {
      if (event.target.id === "copyDesign") { copyDesigned(); return; }
      const row = event.target.closest("[data-mark]");
      if (!row) return;
      mark = row.dataset.mark;
      paintViews();
    });
    document.getElementById("designOut").addEventListener("click", (event) => {
      const row = event.target.closest("[data-mark]");
      if (!row) return;
      mark = row.dataset.mark;
      paintViews();
    });
    document.getElementById("modebar").addEventListener("click", (event) => {
      const b = event.target.closest("[data-mode]");
      if (b) setMode(b.dataset.mode);
    });
    document.getElementById("form").addEventListener("input", (event) => {
      const dkey = event.target.dataset.dkey;
      if (dkey) {
        dz[dkey] = event.target.value;
        mark = dkey;
        refreshAll(dkey === "stage" || dkey === "single" || dkey === "cheek");
        return;
      }
      const key = event.target.dataset.key;
      if (!key) return;
      inputs[key] = event.target.value;
      mark = key;
      if (key === "stage") syncStageFields(inputs);
      if (key === "cheek" && inputs.cheek !== "1") { inputs.tc = "0"; inputs.Rc = "0"; inputs.w = "0"; }
      if (mode === "check") {
        checkInputs = Object.assign({}, inputs);
        refreshAll(key === "stage" || key === "cheek");
        return;
      }
      if (key === "n" && inputs.n === "1" && inputs.orient === "laid") inputs.orient = "vertical";
      if (key === "orient" || key === "n") drawForm();
      commit();
    });
    document.getElementById("print").onclick = () => { paintPrintMeta(); window.print(); };

    function start() {
      catalog = PadEye.catalog();
      inputs = PadEye.blankSheet();
      inputs.stage = stageFromNO(inputs.n, inputs.orient);
      inputs.fore = "0";
      inputs.cheek = (Number(inputs.tc) > 0 ? "1" : "0");
      if (inputs.cheek !== "1") { inputs.tc = "0"; inputs.Rc = "0"; inputs.w = "0"; }
      checkInputs = Object.assign({}, inputs);
      refreshAll(true);
    }
    /* ---------- Drag to reorder input boxes; order kept in this browser per mode ---------- */
    const LAYOUT_KEY = "padeye.layout.v1";
    const rowKey = (el) => el.dataset.mark || el.textContent.trim();
    const gridKey = (g) => { const h = g.previousElementSibling; return (h && h.tagName === "H2") ? (h.dataset.sec || h.textContent.trim()) : "grid"; };
    function loadLayout() { try { return JSON.parse(localStorage.getItem(LAYOUT_KEY)) || {}; } catch (e) { return {}; } }
    function saveLayout() {
      const all = loadLayout(), cur = {};
      document.querySelectorAll("#form .fgrid").forEach((g) => { cur[gridKey(g)] = [...g.children].map(rowKey); });
      all[mode] = Object.assign(all[mode] || {}, cur);
      localStorage.setItem(LAYOUT_KEY, JSON.stringify(all));
    }
    function applyLayout() {
      const form = document.getElementById("form");
      const saved = loadLayout()[mode] || {};
      form.querySelectorAll(".fgrid").forEach((g) => {
        const order = saved[gridKey(g)];
        const kids = [...g.children];
        if (order) {
          const pos = (el) => { const i = order.indexOf(rowKey(el)); return i < 0 ? 1e6 + kids.indexOf(el) : i; };
          kids.sort((a, b) => pos(a) - pos(b)).forEach((el) => g.appendChild(el));
        }
        [...g.children].forEach((el) => {
          if (el.querySelector(":scope > .grip")) return;
          const grip = document.createElement("span");
          grip.className = "grip noprint"; grip.textContent = "\u2807"; grip.title = "Drag";
          el.appendChild(grip);   // last child: keeps the nth-child layout rules intact
        });
      });
      if (!form.querySelector(".layoutbar")) {
        const bar = document.createElement("div");
        bar.className = "layoutbar noprint";
        bar.innerHTML = '<button type="button" id="resetLayout">Reset layout</button><button type="button" id="copyLayout">Copy layout</button>';
        form.insertBefore(bar, form.firstChild);
      }
    }
    new MutationObserver(applyLayout).observe(document.getElementById("form"), { childList: true });
    let dragEl = null;
    document.getElementById("form").addEventListener("pointerdown", (e) => {
      const grip = e.target.closest(".grip");
      if (!grip) return;
      e.preventDefault();
      dragEl = grip.parentElement; dragEl.classList.add("dragging");
      grip.setPointerCapture(e.pointerId);
    });
    document.getElementById("form").addEventListener("pointermove", (e) => {
      if (!dragEl) return;
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const target = under && under.closest(".fgrid > *");
      if (!target || target === dragEl || target.parentElement !== dragEl.parentElement) return;
      const r = target.getBoundingClientRect();
      const after = (e.clientY > r.bottom - r.height / 2) || (e.clientX > r.left + r.width / 2 && e.clientY > r.top);
      target.parentElement.insertBefore(dragEl, after ? target.nextSibling : target);
    });
    const endDrag = () => { if (!dragEl) return; dragEl.classList.remove("dragging"); dragEl = null; saveLayout(); };
    document.getElementById("form").addEventListener("pointerup", endDrag);
    document.getElementById("form").addEventListener("pointercancel", endDrag);
    document.getElementById("form").addEventListener("click", (e) => {
      if (e.target.id === "resetLayout") {
        const all = loadLayout(); delete all[mode]; localStorage.setItem(LAYOUT_KEY, JSON.stringify(all));
        refreshAll(true);
      } else if (e.target.id === "copyLayout") {
        const text = JSON.stringify(loadLayout());
        const done = () => { e.target.textContent = "Copied"; setTimeout(() => { e.target.textContent = "Copy layout"; }, 1200); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => { prompt("Layout", text); });
        else prompt("Layout", text);
      }
    });

    start();
  </script>
</body>
</html>
