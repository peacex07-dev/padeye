<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DNV 2.7-1 / DNV-ST-E271 pad eye</title>
  <style>
    :root { --ink: #1c1915; --muted: #5b6168; --line: #d5d9de; --paper: #ffffff; --blue: #0070C0; --ok: #0b5d1e; --bad: #8d2e2e; --title: #DEEAF1; --input: #FFF6D9; --result: #E6F2DF; --soft: #F4F6F8; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; color: var(--ink); background: var(--paper); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    header, main { width: min(1180px, calc(100% - 28px)); margin: 0 auto; }
    main { padding-bottom: 40px; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; padding: 14px 18px; margin-top: 14px; background: var(--title); border-radius: 6px; }
    h1 { margin: 0; font-size: 21px; line-height: 1.25; font-weight: 700; }
    h2 { margin: 26px 0 10px; font-size: 17px; line-height: 1.3; font-weight: 700; padding: 0 0 5px; border-bottom: 2px solid var(--line); }
    p { margin: 4px 0; }
    .muted { color: var(--muted); font-size: 13px; }
    button, select, input { font: inherit; color: inherit; }
    button { border: 1px solid #8fa0b5; border-radius: 6px; padding: 8px 14px; background: var(--title); color: var(--ink); cursor: pointer; font-weight: 600; }
    .panel { background: #ffffff; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px 12px; min-width: 0; }
    .panel h2 { margin-top: 2px; font-size: 15px; }
    input, select { width: 100%; min-width: 0; padding: 6px 8px; border: 1px solid #b9c0c8; border-radius: 4px; background: var(--input); font-weight: 600; font-size: 15px; }
    .unit { color: var(--muted); font-size: 13px; }
    .stats { display: flex; flex-wrap: wrap; gap: 12px; margin: 14px 0 6px; }
    .stat { background: var(--result); color: var(--ok); padding: 9px 16px; min-width: 190px; border-radius: 6px; font-size: 14px; }
    .stat b { display: block; font-size: 20px; line-height: 1.3; }
    .pass { color: var(--ok); } .fail { color: var(--bad); }
    svg { width: 100%; height: auto; display: block; }
    table { width: 100%; border-collapse: collapse; background: white; margin-bottom: 14px; font-size: 14px; }
    th, td { padding: 7px 10px; text-align: left; vertical-align: top; font-size: 14px; border-bottom: 1px solid #e6e9ec; }
    th { font-size: 13px; color: var(--muted); background: var(--soft); font-weight: 600; }
    td.num { text-align: right; white-space: nowrap; background: var(--result); color: var(--ok); font-weight: 700; }
    td.eq { color: var(--blue); }
    tr.bad td:first-child { color: var(--bad); }
    .note { font-size: 13px; color: var(--muted); }
    #form { margin-top: 10px; }
    #topbar { position: sticky; top: 0; z-index: 5; background: #fff; padding: 4px 0 6px; border-bottom: 2px solid #ccc; }
    #topbar .stats { margin: 4px 0; gap: 8px; }
    #topbar .stat { padding: 5px 12px; min-width: 150px; }
    #topbar .stat.big b { font-size: 26px; }
    #topbar .stat.bad { background: #f7d9d6; color: #a1261b; }
    #chips { display: flex; flex-wrap: wrap; gap: 4px; }
    @media (max-width:860px) { #topbar .stats { flex-direction: row; flex-wrap: nowrap; } #topbar .stat { min-width: 0; width: auto; flex: 1; padding: 3px 6px; font-size: 10px; } #topbar .stat b { font-size: 14px; } #topbar .stat.big b { font-size: 18px; } }
    .uc table { width: 100%; border-collapse: collapse; font-size: 11px; table-layout: fixed; }
    .uc th, .uc td { padding: 1px 4px; border-bottom: 1px solid #e2e2e2; text-align: right; white-space: normal; overflow-wrap: anywhere; }
    .uc th:first-child, .uc td:first-child { text-align: left; }
    .uc col.c1 { width: 34%; } .uc col.c2 { width: 19%; } .uc col.c3 { width: 19%; } .uc col.c4 { width: 13%; } .uc col.c5 { width: 15%; }
    .uc tr.gov td { font-weight: bold; background: #fff6cc; }
    .uc td.r { color: #a1261b; font-weight: bold; } .uc td.g { color: #1f5f1f; }
    .uc h2 { margin: 0 0 2px; }
    #form .fgrid > label.row[data-mark="shackle"] { grid-template-areas: "sym lab req rec inp inp st"; }
    #ucR, #ucL { display: none !important; } #ucR { position: sticky; top: 0; z-index: 4; background: #fff; padding-bottom: 4px; border-bottom: 2px solid #ccc; }
    @media (min-width: 1320px) { #ucR { display: block; } #ucL { display: none; } }
    #chips { display: none !important; }
    td.ucbad { color: #a1261b; font-weight: bold; }
    .chip { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #e3f0dc; color: #1f5f1f; white-space: nowrap; }
    .chip.bad { background: #f7d9d6; color: #a1261b; font-weight: bold; }
    #form h2 { margin: 14px 0 8px; font-size: 16px; }
    .fgrid > * { position: relative; padding-left: 14px; }
    .grip { position: absolute; left: 0; top: -4px; cursor: grab; touch-action: none; user-select: none; color: #9aa7b4; font-size: 16px; line-height: 1; padding: 6px 2px; }
    .dragging { opacity: .5; outline: 2px dashed #9aa7b4; }
    .layoutbar { display: flex; gap: 8px; justify-content: flex-end; margin: 4px 0; }
    .layoutbar button { font-size: 12px; padding: 3px 8px; }
    .fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 12px 18px; align-items: end; }
    label.row, .read { display: grid; grid-template-columns: auto minmax(0, 1fr) 40px; grid-template-areas: "sym lab lab" "inp inp unit"; column-gap: 8px; row-gap: 3px; align-items: center; cursor: pointer; min-width: 0; }
    label.row > .sym:empty { display: none; }
    label.row:has(> .sym:empty) { grid-template-areas: "lab lab lab" "inp inp unit"; }
    label.row > .sym, .read > .sym { grid-area: sym; font-weight: 700; color: var(--blue); }
    label.row > :nth-child(2), .read > :nth-child(2) { grid-area: lab; font-size: 13.5px; line-height: 1.25; color: #2f343a; }
    label.row > input { grid-area: inp; }
    label.row > select { grid-column: 1 / -1; grid-row: 2; }
    label.row > :nth-child(4) { grid-area: unit; }
    .read { grid-template-areas: "sym lab" "val val"; grid-template-columns: auto minmax(0, 1fr); cursor: default; }
    .read > b { grid-area: val; background: var(--result); color: var(--ok); padding: 6px 8px; border-radius: 4px; font-size: 15px; }
    label.row[data-mark="stage"], label.row[data-mark="orient"] { grid-column: span 2; }
    #form .note { margin: 10px 0 0; }
    .modebar { display: flex; flex-wrap: wrap; gap: 0; margin: 14px 0 0; }
    .modebar button { flex: 0 1 auto; background: var(--soft); border-color: #b9c0c8; border-radius: 0; }
    .modebar button:first-child { border-radius: 6px 0 0 6px; }
    .modebar button:last-child { border-radius: 0 6px 6px 0; }
    .modebar button.on { background: var(--blue); color: #fff; border-color: var(--blue); }
    .copyrow { margin: 10px 0 0; }
    .copyrow button { font-size: 13px; padding: 5px 10px; background: var(--soft); border-color: #b9c0c8; }
    .errbox { background: #f7e1e1; color: var(--bad); padding: 9px 12px; margin: 8px 0; font-weight: 700; border-radius: 6px; }
    .warn { color: var(--bad); font-weight: 700; }
    table.dz td:first-child { font-weight: 700; width: 190px; }
    table.dz td.pick { background: var(--result); color: var(--ok); font-weight: 700; width: 260px; }
    table.dz tr[data-mark] { cursor: pointer; }
    #designOut h2 { margin-top: 22px; }
    .drawings { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; margin-top: 18px; }
    .drawings .panel svg { max-width: 480px; margin: 0 auto; }
    .drawings #side svg { max-width: 320px; }
    #views > .note { margin: 8px 0 14px; }
    .tscroll { overflow-x: auto; }
    @media (max-width: 860px) {
      .drawings { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      body { font-size: 15px; }
      header, main { width: calc(100% - 20px); }
      header { flex-direction: column; align-items: stretch; padding: 12px; }
      header button { align-self: flex-start; }
      h1 { font-size: 18px; }
      .modebar button { flex: 1 1 100%; border-radius: 6px !important; margin-bottom: -1px; text-align: left; }
      .fgrid { grid-template-columns: 1fr 1fr; gap: 10px 12px; }
      label.row[data-mark="stage"], label.row[data-mark="orient"], label.row[data-mark="shackle"], label.row[data-mark="stdshackle"] { grid-column: 1 / -1; }
      .stats { flex-direction: column; }
      .stat { min-width: 0; width: 100%; }
      .drawings { grid-template-columns: 1fr; }
      table.dz, table.dz tbody, table.dz tr, table.dz td { display: block; width: auto !important; }
      table.dz tr:first-child { display: none; }
      table.dz tr { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; overflow: hidden; }
      table.dz td { border: 0; padding: 4px 10px; }
      table.dz td:first-child { padding-top: 8px; background: var(--soft); }
      table.dz td:last-child { padding-bottom: 8px; color: #3a3f45; }
      .tscroll table { min-width: 640px; }
    }
    @media (max-width: 440px) {
      .fgrid { grid-template-columns: 1fr; }
    }
    .print-only { display: none; }
    .gaprep { margin-top: 10px; width: 816px; max-width: 100%; }
    .gaprep table { width: 100%; margin: 0; font-size: 12px; }
    .gaprep th, .gaprep td { padding: 3px 6px; border-bottom: 1px solid #e6e9ec; vertical-align: top; }
    .gaprep th { background: var(--soft); color: var(--muted); font-weight: 700; font-size: 11px; text-transform: uppercase; }
    .gaprep td.num { text-align: right; white-space: nowrap; background: var(--result); color: var(--ok); font-weight: 700; }
    .gaprep tr.bad td.num { background: #f7d9d6; color: var(--bad); }
    .gaprep .gapok { padding: 6px 8px; background: var(--result); color: var(--ok); font-weight: 700; border: 1px solid #cfe6c7; }
    .gaprep .gapfail { color: var(--bad); font-weight: 700; }
    @page { size: letter portrait; margin: 0.5in 0.5in 0.65in 0.5in; }
    @media print {
      /* Fixed letter spreadsheet — ignore all screen-width breakpoints */
      body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact;
        font: 8.5pt/1.25 "Courier New", Courier, monospace !important; }
      .noprint, .modebar, .layoutbar, .grip, #print, .copyrow, #chips, .uc { display: none !important; }
      .print-only { display: block !important; }
      header, main { width: 100% !important; max-width: none !important; margin: 0 !important; padding: 0 !important; }
      header { margin: 0 0 4px !important; padding: 4px 6px !important; }
      h1 { font-size: 11pt !important; }
      .muted, .devcredit, .printmeta { font-size: 8pt !important; }
      main { display: block !important; }
      #modebar, #topbar, #form, #designOut, #eqs, main > div:has(> #views), main > div:has(> #ucR) {
        order: unset !important; position: static !important; width: 100% !important; max-width: 100% !important;
        max-height: none !important; overflow: visible !important;
      }
      #form, #topbar, #designOut, #eqs, .lsnote, .gaprep { width: 100% !important; max-width: 100% !important; }
      #topbar { position: static !important; border: 0 !important; padding: 0 !important; }
      .stats { display: flex !important; flex-wrap: nowrap !important; margin: 4px 0 !important; gap: 0 !important; }
      .stat { min-width: 0 !important; flex: 1 1 0 !important; padding: 3px 6px !important; font-size: 8pt !important; }
      .stat b { font-size: 10pt !important; }
      h2, #form h2, #designOut h2, .panel h2 { margin: 6px 0 2px !important; padding: 2px 4px !important; font-size: 8.5pt !important; }
      /* One parameter per row: Symbol | Parameter | Requirement | Input | Unit | Status (Recommended dropped) */
      #form .fgrid { display: block !important; width: 100% !important; }
      #form .fgrid > * { padding: 0 !important; border-bottom: 0.5pt solid #ddd !important; }
      #form .colhead { display: grid !important;
        grid-template-columns: 28px 1.35fr 1.1fr 0.95fr 32px 36px !important;
        grid-template-areas: "sym lab req inp unit st" !important;
        column-gap: 4px !important; padding: 1px 0 !important; margin: 2px 0 0 !important;
        font-size: 7.5pt !important; font-weight: 700 !important; }
      #form .colhead > :nth-child(1) { grid-area: sym !important; }
      #form .colhead > :nth-child(2) { grid-area: lab !important; }
      #form .colhead > :nth-child(3) { grid-area: req !important; }
      #form .colhead > :nth-child(4) { display: none !important; } /* Recommended header */
      #form .colhead > :nth-child(5) { grid-area: inp !important; }
      #form .colhead > :nth-child(6) { grid-area: unit !important; }
      #form .colhead > :nth-child(7) { grid-area: st !important; text-align: center !important; }
      #form label.row, #form label.row:has(> .sym:empty), #form label.row:has(> select),
      #form .read, #form label.row[data-mark], #form .fgrid > label.row[data-mark="stage"],
      #form .fgrid > label.row[data-mark="shackle"], #form .fgrid > label.row[data-mark="rope"],
      #form .read[data-mark="ml"] {
        display: grid !important; width: 100% !important; grid-column: auto !important;
        grid-template-columns: 28px 1.35fr 1.1fr 0.95fr 32px 36px !important;
        grid-template-areas: "sym lab req inp unit st" !important;
        column-gap: 4px !important; row-gap: 0 !important; align-items: center !important;
        padding: 0.5px 0 !important; font-size: 8pt !important;
      }
      #form label.row > .sym, #form .read > .sym { grid-area: sym !important; display: block !important; font-size: 8pt !important; }
      #form label.row > :nth-child(2), #form .read > :nth-child(2) { grid-area: lab !important; font-size: 8pt !important; white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; }
      #form .req { grid-area: req !important; display: block !important; font-size: 7.5pt !important; color: #555 !important;
        white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; }
      #form .req:empty { visibility: hidden !important; }
      #form .req:not(:empty)::before, #form .rec:not(:empty)::before { content: none !important; }
      #form .rec { display: none !important; } /* drop Recommended on paper */
      #form label.row > input, #form label.row > select, #form .read > b[data-val], #form .read > b {
        grid-area: inp !important; grid-column: auto !important; grid-row: auto !important;
        width: 100% !important; min-width: 0 !important; font-size: 8pt !important; padding: 1px 3px !important;
        background: #FFF2CC !important; color: #7F3F00 !important; border: 0 !important;
        -webkit-appearance: none !important; appearance: none !important; background-image: none !important;
      }
      #form label.row > .unit, #form .read > .unit { grid-area: unit !important; font-size: 7.5pt !important; }
      #form .stat2, #form .hstat { grid-area: st !important; font-size: 7.5pt !important; text-align: center !important; }
      #form h2 .hstat { float: right; }
      .lsnote { padding: 3px 6px !important; margin: 2px 0 4px !important; font-size: 7.5pt !important; }
      .lsnote .lsrow { grid-template-columns: 72px minmax(0, 1fr) !important; }

      /* Figures after tables, two per row, compact */

      .panel { break-inside: avoid; page-break-inside: avoid; padding: 4px !important; }
      table, .stat, .lsnote, .gaprep, tr, h2, #topbar .stats { break-inside: avoid; page-break-inside: avoid; }
      .tscroll { overflow: visible !important; max-height: none !important; }
      table, th, td { font-size: 7.5pt !important; padding: 1px 4px !important; }
      #views .drawings .panel svg { max-height: 1.85in !important; width: auto !important; max-width: 100% !important; }
      #views .panel.front svg { max-height: 2.1in !important; }
      #views .panel.bowp svg { max-height: 0.9in !important; }

      .gaprep th, .gaprep td { padding: 1px 3px !important; font-size: 7.5pt !important; }
      #designOut { margin-top: 2px !important; }
      #designOut table { font-size: 7.5pt !important; }

    /* ---------- Spreadsheet look (matches Kalun's DNV 2.7-1 workbook) ---------- */
    :root { --title: #DEEAF1; --input: #FFF2CC; --inink: #7F3F00; --result: #E2EFDA; --ok: #006100; --bad: #9C0006; --soft: #F2F2F2; --muted: #595959; --blue: #0070C0; }
    body { font: 13px/1.35 "Courier New", Courier, monospace; }
    button, select, input, table, th, td { font-family: "Courier New", Courier, monospace; }
    header { border-radius: 0; padding: 8px 10px; }
    h1 { font-size: 16px; text-transform: uppercase; }
    .muted { font-size: 11px; }
    h2, #form h2, #designOut h2, .panel h2 { background: var(--soft); border: 0; margin: 16px 0 4px; padding: 3px 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .02em; }
    button { border-radius: 0; border: 1px solid #a6a6a6; padding: 4px 10px; font-weight: 700; font-size: 12px; }
    .modebar button:first-child, .modebar button:last-child { border-radius: 0; }
    .modebar button.on { background: var(--blue); border-color: var(--blue); }
    .fgrid { grid-template-columns: repeat(auto-fill, minmax(520px, 1fr)); gap: 0 28px; align-items: stretch; }
    .fgrid > * { padding: 1px 0 1px 14px; border-bottom: 1px solid #f0f0f0; }
    .grip { top: 2px; padding: 2px; font-size: 13px; }
    label.row, label.row:has(> .sym:empty), .read { grid-template-columns: 44px minmax(0, 1fr) 150px 40px; grid-template-areas: "sym lab inp unit"; column-gap: 6px; row-gap: 0; }
    label.row > .sym:empty { display: block; }
    label.row > .sym, .read > .sym { color: var(--ink); font-size: 12px; }
    label.row > :nth-child(2), .read > :nth-child(2) { font-size: 12px; color: var(--ink); }
    label.row > select { grid-area: inp; grid-column: 3 / 5; grid-row: 1; }
    label.row[data-mark="stage"], label.row[data-mark="orient"], label.row[data-mark="shackle"], label.row[data-mark="stdshackle"] { grid-column: auto; }
    label.row > select { grid-column: 3 / 5; }
    label.row[data-mark="stage"] , label.row[data-mark="orient"] { grid-template-columns: 44px minmax(0, 1fr) 250px 0; }
    input, select { border: 0; border-radius: 0; background: var(--input); color: var(--inink); font-weight: 700; font-size: 13px; padding: 3px 6px; }
    input { text-align: right; }
    input::placeholder { color: #b08a5a; }
    .unit { font-size: 12px; color: var(--ink); }
    .read { grid-template-areas: "sym lab val val"; }
    .read > b { border-radius: 0; padding: 3px 6px; font-size: 13px; text-align: right; }
    .stats { gap: 0; margin: 12px 0 4px; border: 1px solid #d9d9d9; }
    .stat { border-radius: 0; padding: 4px 10px; min-width: 170px; font-size: 11px; border-right: 1px solid #fff; }
    .stat b { font-size: 15px; }
    table, th, td { font-size: 12px; }
    th, td { padding: 3px 8px; border-bottom: 1px solid #f0f0f0; }
    th { background: #fff; color: var(--ink); font-weight: 700; }
    td.num, table.dz td.pick { font-weight: 700; }
    .panel { border-radius: 0; border: 1px solid #d9d9d9; }
    .errbox { border-radius: 0; background: #FFC7CE; color: var(--bad); }
    .layoutbar button, .copyrow button { font-size: 11px; padding: 2px 8px; background: #fff; }
    @media (max-width: 700px) {
      .fgrid { grid-template-columns: 1fr; }
      label.row, label.row:has(> .sym:empty), .read { grid-template-columns: 30px minmax(0, 1fr) 110px 30px; }
      label.row[data-mark="stage"], label.row[data-mark="orient"] { grid-template-columns: 30px minmax(0, 1fr); grid-template-areas: "sym lab" "inp inp"; }
      label.row[data-mark="stage"] > select, label.row[data-mark="orient"] > select { grid-column: 1 / -1; grid-row: 2; }
      table.dz tr { border-radius: 0; }
    }

    /* ---------- Two-column: inputs left, figures right ---------- */
    main { display: flex; flex-direction: column; }
    #modebar { order: 1; } #topbar { order: 2; } #form { order: 2; } main > div:has(> #views) { order: 3; } #stats { order: 4; } #designOut { order: 5; } #eqs { order: 6; }
    label.row[data-mark="stage"], label.row[data-mark="orient"] { grid-template-columns: 44px minmax(0, 1fr) minmax(0, 300px) 0; }
    label.row[data-mark="stage"] > select, label.row[data-mark="orient"] > select { text-overflow: ellipsis; }
    .drawings .panel svg, .drawings #side svg { max-width: 100%; }
    @media (min-width: 1100px) {
      header, main { width: min(1880px, calc(100% - 28px)); }
      main { display: grid; grid-template-columns: minmax(560px, 1fr) minmax(0, 1.05fr); column-gap: 22px; align-items: start; }
      main > * { grid-column: 1; min-width: 0; }
      main > div:has(> #views) { grid-column: 2; grid-row: 1 / span 6; position: sticky; top: 0; max-height: 100vh; overflow-y: auto; }
      #modebar { grid-row: 1; } #topbar { grid-row: 2; } #form { grid-row: 3; } #designOut { grid-row: 4; } #eqs { grid-row: 5; }
      .fgrid { grid-template-columns: 1fr; }
      #views .drawings { grid-template-columns: 1fr 1fr; margin-top: 14px; gap: 10px; }
      #views .panel.front { grid-column: 1 / -1; }
      #views .drawings .panel.front svg { max-width: 620px; }

    @media (min-width: 1100px) and (max-width: 1319px) {

<body>
  <header>
    <div>
      <p class="muted" id="asset">DNV-ST-E271 [4.2.4.1], [4.4.1]</p>
      <h1>DNV 2.7-1 / DNV-ST-E271 pad eye</h1>
      <p class="devcredit">Developed by Kalun Dugas</p>
      <p class="print-only printmeta" id="printMeta"></p>
    </div>
    <button class="noprint" id="print" type="button">Print</button>
  </header>
  <main>
    <div class="modebar noprint" id="modebar"></div>
    <div id="topbar"><div class="stats" id="stats"></div><div id="chips"></div><div class="uc" id="ucL"></div></div>
    <section id="form"></section>
    <div id="designOut"></div>
    <div>
      <div class="uc" id="ucR"></div>
      <section id="views">
        <div class="drawings">
          <div class="panel shk"><h2 id="shkTitle">Shackle</h2><div id="shk"></div></div>
          <div class="panel front">
            <h2>Front view, looking at the plate</h2>
            <div id="front"></div>
          </div>
          <div class="panel"><h2>Edge view</h2><div id="side"></div></div>
          <div class="panel"><h2>Orientation on the top perimeter beam</h2><div id="post"></div></div>
          <div class="panel bowp">
            <h2>Rope gap</h2>
            <div id="bow"></div>
          </div>
        </div>
      </section>
    </div>
    <div id="eqs">
    <h2>Checks</h2>
    <div class="tscroll"><table id="checks"></table></div>
    <div class="tscroll"><table id="fits"></table></div>
    <div id="gapReport" class="gaprep" hidden></div>
    </div>
  </main>
  <script src="calc.js"></script>
  <script src="lifting_set.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const project = params.get("project") || "";
    const calc = params.get("calc") || "dnv";
    const HELP = {
      stage: "4-leg or 2-leg sling. Pad eyes vertical, horizontal, or laid over (tilted with the sling).",
      single: "One pad eye with a single leg: the load is Rg (Eq. 4.6 style, 5 Rg). The set has no master link.",
      stdshackle: "Auto starts at the smallest shackle that carries the leg load and steps up until a plate design passes and the thimble fits. Pick one to force it.",
      stdrope: "Auto picks the smallest wire rope whose single-leg WLL carries the leg load (02_8-3_LiftingSet.py). Pick one to force it.",
      fore: "Adds a forerunner (rope from the master link to the crane hook) sized for Rg, with the API 2CCU Table 16 minimum length.",
      mgw: "Rg is the rating, the maximum gross weight. DNV writes this as R in the load equation. On the plate, R is the radius.",
      n: "n is how many pad eyes share the lift. Two use one in the denominator. Four use three.",
      theta: "θ is the sling angle from horizontal. It has to be at least 45° and below 90°. β is 90° minus θ.",
      k: "k is the asymmetry factor. Use 1 when the pad eyes share the load equally.",
      re: "Re is the plate yield. Tear-out, contact, and the cheek weld compare with Re. The base compares with 0.85 Re.",
      orient: "Orientation decides which part of the sling pulls on the base.",
      oop: "Out-of-plane angle for a vertical or horizontal pad eye, cases 1 to 4. The in-plane load is RSL times cos of this angle, then split into N and V as before. The out-of-plane load is RSL times sin of this angle plus the 2.5° alignment tolerance. Zero leaves those cases as they were. Laid over ignores this and uses the lay-down angle.",
      tilt: "Tilt is the laid-over plate measured from vertical. Delta is the leg angle minus this tilt.",
      rope: "The rope size picks the Crosby G-414 thimble. The thimble wall is on the bow side of the rope.",
      tol: "Entered bow-gap tolerance. The check uses the larger of this and Crosby Tol. C.",
      shackle: "The shackle fixes the jaw, the pin, and the inside length. The pad eye is drawn to those.",
      t: "t is the main plate thickness. Tear-out uses this plate only.",
      R: "R is the main-plate radius, from the hole centre to the outer edge.",
      Dh: "Dh is the hole diameter. It has to clear the largest pin and stay within 6 percent of the pin.",
      b: "b is the base width welded to the container.",
      h: "h is the distance from the hole centre down to the base.",
      tc: "tc is the cheek thickness on each side. The jaw sees t + 2 tc.",
      Rc: "Rc is the cheek radius. The cheek weld uses the diameter 2 Rc.",
      w: "w is the fillet weld leg around the cheek.",
      A: "A is the shackle jaw. The stack t + 2 tc has to sit between 75 percent of A and A.",
      pin: "The pin diameter is Crosby dimension B.",
      C: "C is the shackle inside length. The clear space to the rope is what remains after the pad eye, the thimble wall, and the rope."
    };
    let inputs = {};
    let mark = "R";
    let score = {};
    let catalog = { shackles: [], ropes: [] };

    function num(key) { const v = Number(String(inputs[key] ?? "").replace(/,/g, "")); return Number.isFinite(v) ? v : NaN; }
    function fmt(n, d = 3) {
      if (n === null || n === undefined || !Number.isFinite(Number(n))) return "—";
      const text = PadEye.pythonFixed(Number(n), d);
      const neg = text.startsWith("-");
      const body = neg ? text.slice(1) : text;
      const parts = body.split(".");
      const grouped = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return (neg ? "-" : "") + grouped + (parts[1] !== undefined ? "." + parts[1] : "");
    }
    function fmtDeg(n) {
      if (n === null || n === undefined || !Number.isFinite(Number(n))) return "—";
      return String(Number(n));
    }
    const FIELDS = [
      ["Load", "mgw", "", "Max gross weight", "lb"],
      ["Load", "theta", "θ", "Sling angle from horizontal", "deg"],
      ["Load", "k", "k", "Uneven load factor", ""],
      ["Load", "re", "Re", "Plate yield strength", "ksi"],
      ["Load", "tilt", "", "Plate tilt from vertical", "deg"],
      ["Shackle", "tol", "", "Extra bow gap allowance", "in"],
      ["Plate", "t", "t", "Main plate thickness", "in"],
      ["Plate", "R", "R", "Main plate radius", "in"],
      ["Plate", "Dh", "Dh", "Hole diameter", "in"],
      ["Plate", "b", "b", "Base width", "in"],
      ["Plate", "h", "h", "Hole centre to base", "in"],
      ["Plate", "tc", "tc", "Cheek thickness, each side", "in"],
      ["Plate", "Rc", "Rc", "Cheek radius", "in"],
      ["Plate", "w", "w", "Cheek weld leg", "in"]
    ];

    function esc(text) {
      return String(text ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    }
    function field(id, symbol, label, unit) {
      const on = mark === id ? " on" : "";
      return `<label class="row${on}" data-mark="${id}"><span class="sym">${symbol}</span><span>${label}</span><input data-key="${id}" value="${esc(inputs[id] ?? "")}"><span class="unit">${unit}</span></label>`;
    }


    /* ---------- Design mode: pick shackle, plate and lifting set from the load ---------- */
    const STAGES = {
      1: { legs: 4, orient: "vertical", label: "4-leg sling, pad eyes vertical" },
      2: { legs: 4, orient: "horizontal", label: "4-leg sling, pad eyes horizontal" },
      3: { legs: 2, orient: "vertical", label: "2-leg sling, pad eyes vertical" },
      4: { legs: 2, orient: "horizontal", label: "2-leg sling, pad eyes horizontal" },
      5: { legs: 2, orient: "laid", label: "2-leg sling, pad eyes laid over (tilted)" },
    };
    let mode = "design";
    let checkInputs = null;
    let dz = { stage: "1", single: "0", mgw: "50000", theta: "45", k: "1", re: "50", oop: "0", tilt: "", shackle: "auto", rope: "auto", tol: "0", fore: "0", bset: "", tset: "", cheek: "0", tc: "", Rc: "", w: "" };
    let designed = null;   // { error, ls, d }
    const dnum = (key) => Number(String(dz[key] ?? "").replace(/,/g, "").trim());

    // Table 8-1 stops at 25,000 kg. Say it in lb, the unit the page takes.
    function lbMsg(msg, mgwLb) {
      const limitLb = Math.floor(25000 / PadEye.KG_PER_LB);
      return String(msg).replace(/Rating [\d,.]+ kg exceeds Table 8-1 range \([\d,.]+ kg\)/, `Rating ${fmt(mgwLb, 0)} lb exceeds Table 8-1 limit (${fmt(limitLb, 0)} lb)`);
    }
    // Same score as PadEye.score, plus a short stop when the cheek weld leg is missing.
    function doScore(inp) {
      const sc = PadEye.score(inp);
      if (sc && !sc.block && Number(inp.tc) > 0 && !(Number(inp.w) > 0)) { sc.block = "Enter weld leg w"; sc.pass = null; }
      if (sc && sc.block) sc.block = lbMsg(sc.block, Number(String(inp.mgw).replace(/,/g, "")));
      return sc;
    }

    // No design: build the plate the user tried, same sizing steps as designPadEye, then the normal checks run on it.
    function attemptPlate(c) {
      const PE = PadEye;
      let typ, size, auto = null;
      const tryD = (sh, tf) => { try { return PE.designPadEye(c.mgw, c.nPe, c.theta, c.k, c.re, c.ropeMm, c.tol, c.ori, null, null, sh, c.tilt, c.oop, tf, true); } catch (e) { return null; } };
      if (c.shackle && c.shackle !== PE.SHACKLE_AUTO) { const sp = c.shackle.indexOf(" "); typ = c.shackle.slice(0, sp); size = c.shackle.slice(sp + 1); auto = tryD(c.shackle, null); }
      else { auto = tryD(PE.SHACKLE_AUTO, null); if (auto) { typ = auto.shackle_type; size = auto.shackle_size; } else { const cand = PE.autoShackle(c.mgw, c.nPe, c.theta, c.k)[0]; if (!cand || !cand.length) return null; [typ, size] = cand[0]; } }
      const sh = PE.SHACKLES[typ][size];
      const hole = PE.tableHole(size, sh.B);
      const Dh = hole.dia ? hole.dia : (auto ? auto.Dh : null);
      if (!Dh) return null;
      const t = c.tFix || (auto ? auto.t : PE.PLATE_THICKNESSES.find((p) => PE.JAW_FILL_MIN * sh.A - 1e-9 <= p && p <= sh.A + 1e-9));
      if (!t) return null;
      const P = PE.designLoad(c.mgw, c.nPe, c.theta, c.k)[0] / 1000.0, step = PE.DESIGN_STEP_IN;
      const Rr = PE.ceilStep(3 * P / (2 * c.re * t) + Dh / 2, step);
      const b = c.bFix || PE.ceilStep(2 * Rr, step);
      const d = auto && !c.tFix && !c.bFix ? { shackle_type: typ, shackle_size: size, t: auto.t, R: auto.R, Dh: auto.Dh, b: auto.b, h: auto.h, hole: auto.hole }
        : { shackle_type: typ, shackle_size: size, t, R: Rr, Dh, b, h: Rr, hole };
      if (dz.cheek === "1") { const tc = dnum("tc"), Rc = dnum("Rc"), w = dnum("w"); if ([tc, Rc, w].every((v) => Number.isFinite(v) && v > 0)) { d.tc = tc; d.Rc = Rc; d.w = w; } }
      return d;
    }
    function runDesign() {
      const st = STAGES[dz.stage];
      const single = dz.single === "1";
      const nPe = single ? 1 : st.legs;
      const out = { nPe, error: null, ls: null, d: null };
      try {
        const mgw = dnum("mgw"), theta = single ? 90 : dnum("theta"), k = dnum("k"), re = dnum("re"), tol = dnum("tol");
        const oop = dz.stage === "5" ? 0 : (String(dz.oop).trim() === "" ? 0 : dnum("oop"));
        if (![mgw, theta, k, re, tol, oop].every(Number.isFinite)) throw new Error("Fill every yellow box with a number.");
        if (mgw <= 0) throw new Error("Rating Rg must be above zero.");
        let tilt = null;
        if (dz.stage === "5" && !single && String(dz.tilt).trim() !== "") {
          tilt = dnum("tilt");
          if (!Number.isFinite(tilt)) throw new Error("Tilt must be a number, or leave it blank for auto.");
          if (theta >= 45 && theta < 90 && Math.abs((90 - theta) - tilt) > 2.5 + 1e-9) {
            throw new Error(`Tilt must be within 2.5° of sling (90 − θ = ${fmtDeg(90 - theta)}°)`);
          }
        }
        out.in = { mgw, theta, k, re, tol, oop, tilt };
        const fore = dz.fore === "1";
        const ropeChoice = dz.rope === "auto" ? null : dz.rope;
        // 1. lifting set from the load (needed first: the rope sets the thimble that the pad eye must clear)
        out.ls = LiftingSet.design({ mgwLb: mgw, nLegs: nPe, angleHDeg: theta, k, forerunner: fore, ropeLabel: ropeChoice });
        if (!out.ls.leg) throw new Error("No wire rope up to 2-1/2 in carries this leg load. Split the lift or use chain.");
        const ropeLabel = out.ls.leg.size;
        if (!(ropeLabel in PadEye.ROPE_IN) || !(ropeLabel in PadEye.ROPE_THIMBLE)) {
          throw new Error(`The lifting set needs ${ropeLabel} rope, which has no G-414 thimble in the pad eye tables. Use a pad eye with a different arrangement or check 02_8-3_LiftingSet.py.`);
        }
        if (out.ls.leg.too_small) throw new Error(`The rope you picked (${ropeLabel}, WLL ${fmt(out.ls.leg.wll_lb, 0)} lb) is below the leg load ${fmt(LiftingSet.tToLb(out.ls.wll_req_t), 0)} lb. Pick a bigger rope or Auto.`);
        const ropeMm = PadEye.ROPE_IN[ropeLabel] * PadEye.MM_PER_IN;
        out.ropeLabel = ropeLabel;
        const shackle = dz.shackle === "auto" ? PadEye.SHACKLE_AUTO : dz.shackle;
        const ori = single ? PadEye.ORIENTATIONS[st.orient === "horizontal" ? 1 : 0]
          : PadEye.ORIENTATIONS[{ vertical: 0, horizontal: 1, laid: 2 }[st.orient]];
        // 2. shackle and plate (04_4-4-1_PadEye.py design_pad_eye)
        let tFix = null;
        if (String(dz.tset ?? "").trim() !== "") {
          tFix = dnum("tset");
          if (!(Number.isFinite(tFix) && tFix > 0)) throw new Error("Plate thickness must be a number, or leave it blank for auto.");
        }
        { const bs = String(dz.bset ?? "").trim(); out.ctx = { mgw, nPe, theta, k, re, ropeMm, tol, ori, shackle, tilt: st.orient === "laid" && !single ? tilt : null, oop, tFix, bFix: bs !== "" && Number.isFinite(dnum("bset")) ? dnum("bset") : null }; }
        try {
          out.d = PadEye.designPadEye(mgw, nPe, theta, k, re, ropeMm, tol, ori, null, null, shackle, st.orient === "laid" && !single ? tilt : null, oop, tFix);
        } catch (e) {
          if (tFix && e instanceof Error && e.message.startsWith("No single-plate")) {
            try { const dA = PadEye.designPadEye(mgw, nPe, theta, k, re, ropeMm, tol, ori, null, null, shackle, st.orient === "laid" && !single ? tilt : null, oop, null); out.attempt = Object.assign({}, dA, { t: tFix }); } catch (e2) { /* nothing to show */ }
            throw new Error(`Plate thickness ${fmt(tFix, 3)} in fails jaw fit, tear-out or contact`);
          }
          throw e;
        }
        // Base length override: blank = auto. Must be at least the auto minimum (b >= 2R and Eq. 4.1).
        if (String(dz.bset ?? "").trim() !== "") {
          const bu = dnum("bset");
          if (!Number.isFinite(bu)) throw new Error("Base length must be a number, or leave it blank for auto.");
          if (bu < out.d.b - 1e-9) { out.attempt = Object.assign({}, out.d, { b: bu }); }
          if (bu < out.d.b - 1e-9) throw new Error(`Below minimum ${fmt(out.d.b, 4)} in`);
          const d = out.d;
          d.result = PadEye.run(mgw, nPe, theta, k, d.shackle_type, d.shackle_size, d.t, d.R, d.Dh, bu, d.h, 0.0, 0.0, 0.0, re, ropeMm, tol, ori, 0.0, st.orient === "laid" && !single ? tilt : null, oop);
          if (!d.result.checks.every((c) => c.ok)) { out.attempt = Object.assign({}, d, { b: bu }); }
          if (!d.result.checks.every((c) => c.ok)) throw new Error(`Below minimum ${fmt(d.b, 4)} in`);
          d.b = bu;
        }
        // Cheek plates: user enters tc, Rc, w; no sizing. The Python checks (Eq. 4.15, Rc <= R, t + 2tc <= A) judge them.
        if (dz.cheek === "1") {
          const tc = dnum("tc"), Rc = dnum("Rc"), w = dnum("w");
          if (![tc, Rc, w].every((v) => Number.isFinite(v) && v > 0)) throw new Error("Enter cheek tc, Rc and w");
          const d = out.d;
          d.tc = tc; d.Rc = Rc; d.w = w;
          d.result = PadEye.run(mgw, nPe, theta, k, d.shackle_type, d.shackle_size, d.t, d.R, d.Dh, d.b, d.h, tc, Rc, w, re, ropeMm, tol, ori, 0.0, st.orient === "laid" && !single ? tilt : null, oop);
        }
        // 3. lifting set again with the shackle the plate design settled on
        out.ls = LiftingSet.design({ mgwLb: mgw, nLegs: nPe, angleHDeg: theta, k, forerunner: fore, shackle: `${out.d.shackle_type} ${out.d.shackle_size}`, ropeLabel: ropeChoice });
        out.ropeLabel = ropeLabel;
      } catch (err) {
        if (!(err instanceof Error)) throw err;
        out.error = lbMsg(err.message, dnum("mgw"));
        if (out.ctx) { try { out.attempt = attemptPlate(out.ctx) || out.attempt || null; } catch (e) { /* keep any earlier attempt */ } }
        if (out.attempt && out.in) { try { out.ls = LiftingSet.design({ mgwLb: out.in.mgw, nLegs: out.nPe, angleHDeg: out.ctx.theta, k: out.in.k, forerunner: dz.fore === "1", shackle: `${out.attempt.shackle_type} ${out.attempt.shackle_size}`, ropeLabel: dz.rope === "auto" ? null : dz.rope }); } catch (e) { /* keep first lifting set */ } }
        out.d = null;
      }
      return out;
    }

    function designInputs(out) {

    // Recommended column: rerun the same design with only that row's override set back to auto. Display only.

    // Shackle list: each option gets the result of the same design and checks as if it were picked.
    function shackleResult(name) {
      const keep = dz.shackle; dz.shackle = name;
      try {
        const o = runDesign(), d = o.d || o.attempt;
        if (!d) return null;
        const sc = doScore(designInputs(Object.assign({}, o, { d })));
        if (!sc || sc.block) return null;
        const us = (sc.rows || []).map((r) => r.util);
        if (o.ls && o.ls.shackle) us.push(o.ls.shackle.utilisation);
        if (o.ls && o.ls.leg) us.push(o.ls.leg.util);
        if (o.ls && o.ls.master_link) us.push(o.ls.master_link.util);
        const ok = !!o.d && sc.pass === true && us.every((u) => u <= 1) && (sc.fits || []).every((f) => f.ok);
        return { ok, u: Math.max(...us) };
      } catch (e) { return null; } finally { dz.shackle = keep; }

    function paintShackleLabels() {

    function recWith(key, autoVal, pick) {

    function lbT(t) { return `${fmt(t, 3)} t (${fmt(LiftingSet.tToLb(t), 0)} lb)`; }
    function drow(mk, name, pick, detail, bad) {

    function liftingRows(out, forPad) {
      const ls = out.ls, rows = [];

      rows.push(drow("", "Lifting set", n === 1 ? "Single pad eye, single leg" : `${n}-leg set, ${n} pad eyes`,

      }

        rows.push(drow("", "Thimble", `Crosby G-414 for ${th.rope_in}`, `Stock ${th.stock} · D ${fmt(th.D, 2)} · E ${fmt(th.E, 2)} in${fit}`));

      }

    function renderDesignOut() {
      const host = document.getElementById("designOut");
      if (mode !== "design" || !designed) { host.innerHTML = ""; return; }

          ${drow("R", "Radius R", `${fmt(d.R, 4)} in`, "")}
          ${drow("Dh", "Hole diameter Dh", `${fmt(d.Dh, 3)} in`, `pin ${fmt(sh.B, 3)} in${hole ? " · " + esc(hole) : ""}`)}

    }

    let checkSeeded = false;
    function seedCheck() {
      if (designed && designed.d) return designInputs(designed);
      // design failed: keep the loads from the Design form, plate from the sample sheet
      const b = PadEye.blankSheet(), st = STAGES[dz.stage], single = dz.single === "1";
      const th = single ? "90" : String(dz.theta);
      const tiltAuto = Number.isFinite(90 - Number(th)) ? String(90 - Number(th)) : "30";
      return Object.assign(b, {
        mgw: String(dz.mgw), n: String(single ? 1 : st.legs), theta: th, k: String(dz.k), re: String(dz.re), tol: String(dz.tol),
        orient: single ? (st.orient === "horizontal" ? "horizontal" : "vertical") : st.orient,
        stage: dz.stage, fore: dz.fore || "0", cheek: dz.cheek || "0",

    function setMode(next) {
      if (next === mode) return;

        // first visit only: start from the designed plate. After that keep the user's own edits.
        if (!checkSeeded) { checkInputs = seedCheck(); checkSeeded = true; }
        inputs = Object.assign({}, checkInputs);
        syncStageFields(inputs);
        if (inputs.cheek !== "1") inputs.cheek = Number(inputs.tc) > 0 ? "1" : "0";
        mode = "check";

        checkInputs = Object.assign({}, inputs);

    function refreshAll(redrawForm) {

          if (score && !score.block) {

    /* ---------- Check Existing: same spreadsheet form as Design, with R/Dh/h/C kept ---------- */
    function stageFromNO(n, orient) {
      const nn = String(n), o = orient || "vertical";
      if (nn === "4" && o === "horizontal") return "2";
      if (nn === "4") return "1";
      if (nn === "2" && o === "horizontal") return "4";
      if (nn === "2" && o === "laid") return "5";
      if (nn === "2") return "3";

    }
    function syncStageFields(inp) {
      if (!inp.stage || !STAGES[inp.stage]) inp.stage = stageFromNO(inp.n, inp.orient);
      const st = STAGES[inp.stage];
      inp.n = String(st.legs);
      inp.orient = st.orient;
      if (inp.fore !== "1") inp.fore = "0";
      if (inp.cheek !== "1") inp.cheek = "0";

    function checkLiftingSet(inp) {
      const mgw = Number(String(inp.mgw).replace(/,/g, ""));
      const n = Number(inp.n);
      const theta = Number(inp.theta);
      const k = Number(inp.k);
      if (![mgw, n, theta, k].every(Number.isFinite)) return null;
      const ropeChoice = !inp.rope || inp.rope === "auto" ? null : inp.rope;
      const shOpt = (!inp.shackle || inp.shackle === "auto") ? undefined : inp.shackle;
      try {
        return LiftingSet.design({ mgwLb: mgw, nLegs: n, angleHDeg: theta, k, forerunner: inp.fore === "1", shackle: shOpt, ropeLabel: ropeChoice });
      } catch (e) { return null; }
    }
    // Resolve Auto rope/shackle and cheek-off zeros for scoring; never throws.
    function resolvedCheck(raw) {
      const inp = syncStageFields(Object.assign({}, raw));
      if (inp.cheek !== "1") { inp.tc = "0"; inp.Rc = "0"; inp.w = "0"; }
      let ls = checkLiftingSet(inp);
      if (inp.rope === "auto" && ls && ls.leg) inp.rope = ls.leg.size;
      if (inp.shackle === "auto") {
        if (ls && ls.shackle) inp.shackle = `${ls.shackle.type} ${ls.shackle.size}`;
        else {
          try {
            const d = runDesign();
            if (d && d.d) inp.shackle = `${d.d.shackle_type} ${d.d.shackle_size}`;
          } catch (e) { /* leave auto; score will block */ }
        }
      }
      // refresh ls with resolved shackle/rope so WLL matches what is scored
      ls = checkLiftingSet(inp) || ls;
      return { inp, ls };
    }

    function paintCheckStatus() {
      const ls = checkLs, st = {}, val = {}, req = Object.assign({}, REQ);
      const P = (b) => (b ? "PASS" : "FAIL");
      if (ls) {
        val.wllmin = fmt(ls.wll_min_t, 3); val.wlls = fmt(ls.wll_req_t, 3);
        req.wlls = ls.n_legs === 4 ? "WLLmin / (3 cos β)" : ls.n_legs === 2 ? "WLLmin / (2 cos β)" : "WLLmin";
        if (ls.leg) st.rope = P(ls.leg.util <= 1 && !ls.leg.too_small);
        if (ls.master_link) { val.ml = `A-1346 stock ${ls.master_link.stock}`; st.ml = P(ls.master_link.util <= 1 && ls.master_link.inside_ok); } else val.ml = "None";
        if (ls.forerunner) st.fore = P(ls.forerunner.util <= 1);

      }
      const fit = (n) => { const f = score && score.fits ? score.fits.find((x) => x.name.startsWith(n)) : null; return f ? P(f.ok) : ""; };
      if (score && score.shackle) { val.jawA = fmt(score.shackle.A, 3); val.pinB = fmt(score.shackle.B, 3); val.lenC = fmt(score.shackle.C, 3); }
      if (score && !score.block) {
        st.tol = fit("Thimble fits shackle bow");
        const a = fit("Thickness fits shackle jaw"), b = fit("Thickness >= 75");
        if (a && b) st.t = P(a === "PASS" && b === "PASS");
        if (inputs.cheek === "1") { st.tc = a; st.Rc = fit("Cheek radius"); }
        const chk = (n) => { const r = (score.rows || []).find((x) => x.name.startsWith(n)); return r ? P(r.ok) : ""; };
        st.b = chk("Base"); if (inputs.cheek === "1") st.w = chk("Eq. 4.15");
        st.re = P(["Eq. 4.13", "Eq. 4.14", "Base"].every((n) => chk(n) !== "FAIL"));

        st.R = fit("R within"); st.Dh = fit("Hole clears") || fit("Hole clearance");

        if (/shackle/i.test(score.block)) st.shackle = "FAIL";
        if (/weld leg/i.test(score.block)) st.w = "FAIL";

      const f = document.getElementById("form");
      f.querySelectorAll("[data-val]").forEach((e) => { e.textContent = val[e.dataset.val] ?? ""; });
      f.querySelectorAll(".fgrid > [data-mark]").forEach((row) => {
        const id = row.dataset.mark;

      });
      f.querySelectorAll("h2[data-sec]").forEach((h) => {
        const g = h.nextElementSibling, vals = [...g.querySelectorAll(".stat2")].map((e) => e.textContent).filter(Boolean);
        let r = vals.length ? P(vals.every((v) => v === "PASS")) : "";
        if (h.dataset.sec === "plate" && score && score.pass !== null && score.pass !== undefined) r = P(score.pass && (!vals.length || vals.every((v) => v === "PASS")));
        if (h.dataset.sec === "load" || h.dataset.sec === "req") r = ls ? "PASS" : "";
        const e = h.querySelector(".hstat"); if (e) { e.textContent = r; e.className = "hstat " + (r === "PASS" ? "pass" : r === "FAIL" ? "fail" : ""); }

    function checkShackleResult(name) {
      const trial = Object.assign({}, inputs, { shackle: name });
      try {
        const { inp, ls } = resolvedCheck(trial);
        const sc = doScore(inp);
        const us = [];
        if (sc && !sc.block && sc.governingU != null) us.push(sc.governingU);
        if (ls && ls.shackle) us.push(ls.shackle.utilisation);
        if (sc && sc.fits) sc.fits.forEach((f) => { if (!f.ok) us.push(1.01); });
        if (sc && sc.block) return { ok: false, u: us.length ? Math.max(...us.filter(Number.isFinite)) : Infinity };
        const finite = us.filter(Number.isFinite);
        const u = finite.length ? Math.max(...finite) : 0;
        const ok = !!(sc && sc.pass && (!ls || !ls.shackle || ls.shackle.utilisation <= 1) && (!ls || !ls.leg || (ls.leg.util <= 1 && !ls.leg.too_small)));
        return { ok, u };

    function paintCheckShackleLabels() {

    function outline(b, h, R) {
      // Counter-clockwise. When b/2 > R: vertical sides, flat shoulders at y=h, true semicircle (no diagonal cut).
      const half = Math.max(Number(b) / 2, 1e-9), hh = Math.max(Number(h), 0), rr = Math.max(Number(R), 1e-9);
      const pts = [], stemN = 16, arcN = 48;
      for (let i = 0; i <= stemN; i++) {
        const y = hh * i / stemN;
        let x = half;
        if (half < rr - 1e-12) {
          const dy = y - hh;
          if (Math.abs(dy) <= rr) x = Math.max(half, Math.sqrt(Math.max(0, rr * rr - dy * dy)));
        }
        pts.push([x, y]);
      }
      if (half > rr + 1e-12) pts.push([rr, hh]);
      for (let i = 0; i <= arcN; i++) {
        const a = (i / arcN) * Math.PI;
        pts.push([rr * Math.cos(a), hh + rr * Math.sin(a)]);
      }
      if (half > rr + 1e-12) pts.push([-rr, hh]);
      for (let i = stemN; i >= 0; i--) {
        const y = hh * i / stemN;
        let x = -half;
        if (half < rr - 1e-12) {
          const dy = y - hh;
          if (Math.abs(dy) <= rr) x = -Math.max(half, Math.sqrt(Math.max(0, rr * rr - dy * dy)));
        }
        pts.push([x, y]);
      }
      pts.push([half, 0]);
      return pts;
    }

    /** Label placement. Every diagram label is a <text class="lbl"> with an anchor box (data-a = x0,y0,x1,y1).
     *  After the svg is in the page, placeLabels() measures each label and puts it in the first spot that
     *  touches no other label and no drawn line. When the spot is not right next to the anchor a thin leader
     *  line joins them. Only positions change. No text and no number is changed here. */
    function lbl(text, ax, ay, o = {}) {
      const a = [ax, ay, o.ax1 ?? ax, o.ay1 ?? ay].map(v => Number(v).toFixed(2)).join(",");
      return `<text class="lbl" data-a="${a}" data-pref="${o.pref || "e,ne,se,n,s,w,nw,sw"}"${o.fixed ? ' data-fixed="1"' : ""} x="${o.x ?? ax}" y="${o.y ?? ay}" fill="${o.fill}" font-size="${o.size || 12}"${o.bold === false ? "" : ' font-weight="700"'}${o.anchor ? ` text-anchor="${o.anchor}"` : ""}>${text}</text>`;
    }
    function segHitsBox(s, L, T, R, B) {
      const dx = s[2] - s[0], dy = s[3] - s[1];
      const p = [-dx, dx, -dy, dy], q = [s[0] - L, R - s[0], s[1] - T, B - s[1]];
      let u0 = 0, u1 = 1;
      for (let i = 0; i < 4; i++) {
        if (p[i] === 0) { if (q[i] < 0) return false; }
        else { const t = q[i] / p[i]; if (p[i] < 0) u0 = Math.max(u0, t); else u1 = Math.min(u1, t); }
      }
      return u0 <= u1;
    }
    function placeLabels(svg) {
      if (!svg) return;
      const vb = svg.viewBox.baseVal, W = vb.width, H = vb.height;
      const segs = [], boxes = [];
      const num = (el, k) => Number(el.getAttribute(k));
      svg.querySelectorAll("line").forEach(l => segs.push([num(l, "x1"), num(l, "y1"), num(l, "x2"), num(l, "y2")]));
      svg.querySelectorAll("polyline,polygon").forEach(poly => {
        const pts = poly.getAttribute("points").trim().split(/\s+/).map(q => q.split(",").map(Number));
        for (let i = 0; i < pts.length - 1; i++) segs.push([pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]]);
        if (poly.tagName === "polygon") segs.push([pts[pts.length - 1][0], pts[pts.length - 1][1], pts[0][0], pts[0][1]]);
      });
      svg.querySelectorAll("circle").forEach(c => {
        const cx = num(c, "cx"), cy = num(c, "cy"), r = num(c, "r"), n = 48;
        for (let i = 0; i < n; i++) {
          const a0 = i / n * 2 * Math.PI, a1 = (i + 1) / n * 2 * Math.PI;
          segs.push([cx + r * Math.cos(a0), cy + r * Math.sin(a0), cx + r * Math.cos(a1), cy + r * Math.sin(a1)]);
        }
      });
      svg.querySelectorAll("rect").forEach(r => {
        const st = r.getAttribute("stroke");
        if (!st || st === "none") return;
        const x = num(r, "x"), y = num(r, "y"), w = num(r, "width"), h = num(r, "height");
        segs.push([x, y, x + w, y, ], [x + w, y, x + w, y + h], [x + w, y + h, x, y + h], [x, y + h, x, y]);
      });
      const items = [...svg.querySelectorAll("text.lbl")];
      const measured = items.map(t => {
        const ox = t.getAttribute("x"), oy = t.getAttribute("y"), oa = t.getAttribute("text-anchor");
        t.removeAttribute("text-anchor"); t.setAttribute("x", 0); t.setAttribute("y", 0);
        const b = t.getBBox();
        return { t, ox: Number(ox), oy: Number(oy), oa, w: b.width, h: b.height, dx: b.x, dy: b.y, fixed: t.dataset.fixed === "1" };
      });
      const hitBox = (L, T, R, B) => boxes.filter(q => !(R + 2 <= q[0] || q[2] + 2 <= L || B + 2 <= q[1] || q[3] + 2 <= T)).length;
      const hitSeg = (L, T, R, B) => segs.filter(s => segHitsBox(s, L - 1.5, T - 1.5, R + 1.5, B + 1.5)).length;
      const gaps = [4, 12, 24, 40, 64, 96];
      const put = (m, L, T) => {
        m.t.setAttribute("x", (L - m.dx).toFixed(2)); m.t.setAttribute("y", (T - m.dy).toFixed(2));
        boxes.push([L, T, L + m.w, T + m.h]);
      };
      measured.filter(m => m.fixed).forEach(m => {
        m.t.setAttribute("x", m.ox); m.t.setAttribute("y", m.oy);
        if (m.oa) m.t.setAttribute("text-anchor", m.oa);
        const b = m.t.getBBox(); boxes.push([b.x, b.y, b.x + b.width, b.y + b.height]);
      });
      let unplaced = 0;
      measured.filter(m => !m.fixed).forEach(m => {
        const [x0, y0, x1, y1] = m.t.dataset.a.split(",").map(Number);
        const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, w = m.w, h = m.h;
        const prefs = m.t.dataset.pref.split(",");
        const all = [...new Set([...prefs, "e", "ne", "se", "n", "s", "w", "nw", "sw"])];
        const spot = (d, g) => ({
          c: [cx - w / 2, cy - h / 2], e: [x1 + g, cy - h / 2], w: [x0 - g - w, cy - h / 2],
          n: [cx - w / 2, y0 - g - h], s: [cx - w / 2, y1 + g],
          ne: [x1 + g, y0 - g - h], nw: [x0 - g - w, y0 - g - h], se: [x1 + g, y1 + g], sw: [x0 - g - w, y1 + g],
        })[d];
        let best = null;
        const tryList = [];
        if (prefs.includes("c")) tryList.push(["c", 0]);
        for (const g of gaps) for (const d of all) if (d !== "c") tryList.push([d, g]);
        for (const [d, g] of tryList) {
          const [L, T] = spot(d, g), R = L + w, B = T + h;
          let score = 0;
          if (L < 2 || T < 2 || R > W - 2 || B > H - 2) score += 1000;
          score += 100 * hitBox(L, T, R, B) + 10 * hitSeg(L, T, R, B);
          let leader = null;
          if (g > 6) {
            const px = Math.min(Math.max(L + w / 2, x0), x1), py = Math.min(Math.max(T + h / 2, y0), y1);
            const qx = Math.min(Math.max(px, L), R), qy = Math.min(Math.max(py, T), B);
            leader = [px, py, qx, qy];
            if (boxes.some(q => segHitsBox(leader, q[0] - 1, q[1] - 1, q[2] + 1, q[3] + 1))) score += 100;
          }
          score += g * 0.01;
          if (!best || score < best.score) best = { score, L, T, leader };
          if (score < 1) break;
        }
        if (best.score >= 1) unplaced++;
        put(m, best.L, best.T);
        if (best.leader) {
          const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
          const [a, b, c, d] = best.leader;
          ln.setAttribute("x1", a); ln.setAttribute("y1", b); ln.setAttribute("x2", c); ln.setAttribute("y2", d);
          ln.setAttribute("stroke", m.t.getAttribute("fill")); ln.setAttribute("stroke-width", "0.9"); ln.setAttribute("class", "leader");
          m.t.parentNode.insertBefore(ln, m.t);
          segs.push(best.leader);
        }
      });

    }

    function arrow(x1, y1, x2, y2, color, label, lx, ly) {
      const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
      const ux = dx / L, uy = dy / L;
      const hx = x2 - ux * 10, hy = y2 - uy * 10;

      return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="2"/>
        <polygon points="${x2},${y2} ${hx + nx},${hy + ny} ${hx - nx},${hy - ny}" fill="${color}"/>
        ${lbl(label, x2, y2, { fill: color, pref: "e,ne,se,n,s,w,nw,sw" })}`;
    }

    function axisLabelsForViews() {

      }
      return {
        front: { right: "Y → ML", up: "Z up", into: "⊙ X length (out of page)" },

    function front() {
      const b = num("b"), h = num("h"), R = num("R"), Dh = num("Dh"), Rc = num("Rc"), tc = num("tc");
      const d = score.shackle ? score.shackle.B : 0;
      if (!(b > 0 && h > 0 && R > 0 && Dh > 0)) { document.getElementById("front").innerHTML = ""; return; }
      const cheeks = tc > 0 && Rc > 0;
      const laid = inputs.orient === "laid";
      const horizontal = inputs.orient === "horizontal";
      const delta = Number(score.delta) || 0;
      const theta = num("theta");
      const fromH = laid ? 90 - delta : theta;
      const rad = fromH * Math.PI / 180;
      const len = Math.max(R, 1) * 1.15;
      const ax = Math.cos(rad) * len, ay = Math.sin(rad) * len;
      const N = Number(score.N_kip), V = Number(score.V_kip), Fop = Number(score.Fop_kip), P = Number(score.P_kip);
      const forceScale = Math.max(R, 1) * 0.85 / Math.max(Math.abs(P) || 1, Math.abs(N) || 1, Math.abs(V) || 1, 1);
      // Front view: +x right, +y up the plate. N along the plate (up for vertical/laid), V to the right.
      const nDir = laid || !horizontal ? [0, 1] : [1, 0];
      const vDir = laid || !horizontal ? [1, 0] : [0, 1];
      const nEnd = [nDir[0] * (N || 0) * forceScale, nDir[1] * (N || 0) * forceScale];
      const vEnd = [vDir[0] * (V || 0) * forceScale, vDir[1] * (V || 0) * forceScale];
      const reach = Math.max(b / 2, R, cheeks ? Rc : 0, Dh / 2, Math.abs(ax), Math.abs(nEnd[0]), Math.abs(vEnd[0]));
      const topY = Math.max(h + Math.max(R, cheeks ? Rc : 0), h + ay, h + nEnd[1], h + vEnd[1]);
      // Pixel margins hold the labels: left for h, right for the force tags, top for the note, bottom for b, the beam and the axes.
      const PL = 70, PR = 155, PT = 48, PB = 120;
      const minX = Math.min(-reach, ax, nEnd[0], vEnd[0]) - 1.0;
      const maxX = Math.max(reach, ax, nEnd[0], vEnd[0]) + 0.4;
      const minY = -0.95, maxY = topY + 0.1;
      // Height-first scale so a long base (b >> 2R) does not squash the head. Width may grow; panel scrolls.
      const Svert = (320 - PT - PB) / Math.max(maxY - minY, 1e-6);
      const S = Math.min(Svert, 110 / Math.max(2 * R, 0.5));
      const W = (maxX - minX) * S + PL + PR, Ht = (maxY - minY) * S + PT + PB;
      const X = x => (x - minX) * S + PL, Y = y => (maxY - y) * S + PT;

        if (Number.isFinite(N) && Math.abs(N) > 1e-6) {

        }

        <circle cx="${X(0)}" cy="${Y(h)}" r="${Dh / 2 * S}" fill="white" stroke="${ink("Dh")}"/>

    function side() {
      const t = num("t"), h = num("h"), R = num("R"), Dh = num("Dh"), tc = num("tc"), Rc = num("Rc"), w = num("w");

      const minX = -A / 2 - 0.15, maxX = A / 2 + 0.15, minY = -0.55, maxY = top + 1.15;

      document.getElementById("side").innerHTML = `<svg viewBox="0 0 ${W} ${Ht}">

    function postSketch() {
      const host = document.getElementById("post");
      const theta = num("theta");
      const beta = Number(score.beta);
      const tilt = Number(score.tilt);
      const delta = Number(score.delta);
      const W = 420, H = 280;
      // Isometric-ish corner of the top perimeter beam.
      const ox = 150, oy = 175;
      const ix = 54, iy = -28, jx = 70, jz = -62;
      const to = (u, v, w) => [ox + u * ix + v * jx, oy + u * iy + w * jz];
      const line = (a, b, color = "#5f584c", width = 1.4) => {
        const [x1, y1] = to(...a), [x2, y2] = to(...b);
        return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}"/>`;
      };
      const poly = (pts, fill, stroke = "#1c1915") => {
        const s = pts.map(p => to(...p).join(",")).join(" ");
        return `<polygon points="${s}" fill="${fill}" stroke="${stroke}" stroke-width="1.2"/>`;
      };
      // Beam corner: outer faces along +x (length) and +y (width), top at z=0.
      const beam = [
        poly([[0, 0, 0], [1.4, 0, 0], [1.4, 0, -0.55], [0, 0, -0.55]], "#e7e0d2"),
        poly([[0, 0, 0], [0, 1.2, 0], [0, 1.2, -0.55], [0, 0, -0.55]], "#d9d0c1"),
        poly([[0, 0, 0], [1.4, 0, 0], [1.4, 1.2, 0], [0, 1.2, 0]], "#f3ecdf"),
        line([0, 0, 0], [1.6, 0, 0], "#1e3a5f", 1.6),
        line([0, 0, 0], [0, 1.4, 0], "#1e3a5f", 1.6),
        line([0, 0, 0], [0, 0, 1.1], "#1e3a5f", 1.6),
      ].join("");
      const [zx, zy] = to(0, 0, 0);
      const [xx] = to(1.7, 0, 0);
      const [, yy] = to(0, 1.5, 0);
      const [, zz] = to(0, 0, 1.2);
      const axes = `
        ${lbl("X length", xx, zy, { fill: "#1e3a5f", size: 14, pref: "e,se,ne" })}
        ${lbl("Y → ML", zx, yy, { fill: "#1e3a5f", size: 14, pref: "sw,w,s,nw" })}
        ${lbl("Z up", zx, zz, { fill: "#1e3a5f", size: 14, pref: "ne,n,e,nw" })}
        ${lbl("Top perimeter beam corner", 12, 22, { x: 12, y: 22, fixed: true, fill: "#5f584c", size: 14, bold: false })}`;

      // Sling and ML both lie in the plane X = holeU, so the sling stays in the plate plane.
      const slingToMl = (holeU, holeV, holeW) => {
        const [hx, hy] = to(holeU, holeV, holeW);
        const slingAng = (Number.isFinite(theta) ? theta : 60) * Math.PI / 180;
        const reach = 1.0, toMl = 1.7;
        const at = s => to(holeU, holeV + Math.cos(slingAng) * s, holeW + Math.sin(slingAng) * s);
        const [sx, sy] = at(reach);
        const [mlx, mly] = at(toMl);
        const mlV = holeV + Math.cos(slingAng) * toMl;
        const mlW = holeW + Math.sin(slingAng) * toMl;
        let ring = "";
        const ringR = 0.16;
        for (let i = 0; i < 18; i++) {
          const a0 = (i / 18) * Math.PI * 2;
          const a1 = ((i + 1) / 18) * Math.PI * 2;
          const p0 = to(holeU, mlV + Math.cos(a0) * ringR, mlW + Math.sin(a0) * ringR);
          const p1 = to(holeU, mlV + Math.cos(a1) * ringR, mlW + Math.sin(a1) * ringR);
          ring += `<line x1="${p0[0]}" y1="${p0[1]}" x2="${p1[0]}" y2="${p1[1]}" stroke="#8d2e2e" stroke-width="1.6"/>`;
        }
        return `<line x1="${hx}" y1="${hy}" x2="${sx}" y2="${sy}" stroke="#8d2e2e" stroke-width="2.2"/>
          <line x1="${sx}" y1="${sy}" x2="${mlx}" y2="${mly}" stroke="#8d2e2e" stroke-width="1.2" stroke-dasharray="4 3"/>
          ${lbl("RSL", (hx + sx) / 2, (hy + sy) / 2, { fill: "#8d2e2e", size: 14, pref: "e,se,ne,s,n" })}
          ${ring}
          ${lbl("ML", mlx - 0.16 * 70, mly - 0.16 * 62, { ax1: mlx + 0.16 * 70, ay1: mly + 0.16 * 62, fill: "#8d2e2e", size: 14, pref: "e,ne,se,n,s" })}
          ${lbl("centre of lift", mlx - 0.16 * 70, mly - 0.16 * 62, { ax1: mlx + 0.16 * 70, ay1: mly + 0.16 * 62, fill: "#5f584c", size: 13, bold: false, pref: "e,se,ne,s,n" })}`;
      };

      let plate = "";
      let caption = "";
      if (inputs.orient === "horizontal") {
        // Inside face toward centre (+Y). Plate plane is YZ, so it contains the ML.
        plate = [
          poly([[0.25, 0.02, 0.05], [0.25, 0.02, 0.95], [0.25, 0.7, 0.95], [0.25, 0.7, 0.05]], "#cfe0f5", "#1e3a5f"),
          poly([[0.32, 0.02, 0.05], [0.32, 0.02, 0.95], [0.32, 0.7, 0.95], [0.32, 0.7, 0.05]], "#b7d0ec", "#1e3a5f"),

        const ang = (Number.isFinite(tilt) ? tilt : 30) * Math.PI / 180;

        const tipY = 0.08 + Math.sin(ang) * 0.9;
        const tipZ = Math.cos(ang) * 0.9;
        plate = [
          poly([[0.28, 0.05, 0.02], [0.42, 0.05, 0.02], [0.42, tipY, tipZ], [0.28, tipY, tipZ]], "#cfe0f5", "#1e3a5f"),
          slingToMl(0.35, tipY * 0.45, tipZ * 0.45),
        ].join("");
        caption = `Laid over: on top of the beam, tilted ${fmtDeg(tilt)}° from vertical in the plane toward the ML. Leg angle ${fmtDeg(beta)}°. Delta ${fmtDeg(delta)}° out of the plate plane.`;
      } else {
        // Vertical on top: plate stands on the top face with its plane through the ML (YZ).
        // Earlier drawing put the plate in XZ, which looked perpendicular to the ML.
        plate = [

          poly([[0.40, 0.08, 0.02], [0.40, 0.72, 0.02], [0.40, 0.72, 0.95], [0.40, 0.08, 0.95]], "#b7d0ec", "#1e3a5f"),
          poly([[0.28, 0.08, 0.02], [0.40, 0.08, 0.02], [0.40, 0.72, 0.02], [0.28, 0.72, 0.02]], "#9eb8d6", "#1e3a5f"),
          slingToMl(0.34, 0.42, 0.62),
        ].join("");

      const forceNote = Number.isFinite(Number(score.P_kip))
        ? `RSL ${fmt(score.rsl, 3)} lb = ${fmt(score.P_kip, 3)} kip. N ${fmt(score.N_kip, 3)} kip, V ${fmt(score.V_kip, 3)} kip, Fop ${fmt(score.Fop_kip, 3)} kip.`
        : "";

      host.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${beam}${plate}${axes}</svg>
`;

    function bow() {
      const host = document.getElementById("bow");
      const sh = score.shackle, rope = score.rope;
      if (!sh || !rope || score.gap === null || score.gap === undefined) { host.innerHTML = score.block ? `<p>${score.block}</p>` : ""; return; }
      const R = Math.max(num("R"), num("tc") > 0 ? num("Rc") : 0);
      const shift = (num("Dh") - sh.B) / 2;
      const items = [["R", R, "R"], ["Dh", Math.max(shift, 0), "(Dh−d)/2"], ["rope", rope.H, "H"], ["rope", rope.dia, "rope"], ["C", Math.max(score.gap, 0), "gap"]];
      const available = sh.C + sh.B / 2;
      const sum = items.reduce((s, item) => s + item[1], 0);
      const scale = 520 / Math.max(available, sum, 0.1);
      const top = 50;
      let x = 0;
      const bars = items.map(([id, value, label]) => {
        const w = value * scale;
        const on = mark === id;
        const bar = `<rect x="${x}" y="${top}" width="${Math.max(w, 0)}" height="26" fill="${on ? "#1e3a5f" : "#f3ecdf"}" stroke="#d8cdb8"/>` +
          (w > 42 ? lbl(`${label} ${fmt(value, 3)}`, x, top, { ax1: x + w, ay1: top + 26, fill: on ? "white" : "#1c1915", size: 11, bold: false, pref: "c,s,sw,se" }) : "");
        x += w;
        return bar;
      }).join("");
      const note = score.gap < 0
        ? [`Overrun ${fmt(-score.gap, 3)} in`]
        : [`Gap ${fmt(score.gap, 3)} in (min ${fmt(score.tolEff, 3)} in)`];
      const noteSvg = note.map((line, i) => lbl(line, 0, 16 + i * 17, { x: 2, y: 16 + i * 17, fixed: true, fill: "#5f584c", size: 13, bold: false })).join("");
      host.innerHTML = `<svg viewBox="0 0 560 116">${noteSvg}${bars}${lbl(`Rmin ${fmt(score.rMin, 3)} · Rmax ${fmt(score.rMax, 3)} in`, 0, 110, { x: 2, y: 110, fixed: true, fill: "#5f584c", size: 12, bold: false })}</svg>`;
      placeLabels(host.querySelector("svg"));

    function paintPrintMeta() {
      const el = document.getElementById("printMeta");
      if (!el) return;
      const now = new Date();
      const opts = { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "America/Chicago" };
      const when = now.toLocaleString("en-US", opts) + " America/Chicago";
      const modeLabel = mode === "check" ? "Check Existing" : "Design";
      el.textContent = modeLabel + " · " + when;
    }

    function plainShortfall(provided, required, uc, unitHint) {
      const u = (uc === null || uc === undefined) ? null : Number(uc);
      const nums = (s) => String(s).match(/-?\d+(?:\.\d+)?/g);
      const pN = nums(provided), rN = nums(required);
      const unitFrom = (s) => {
        const m = String(s).match(/\b(ksi|in|t|lb|deg)\b/i);
        return m ? m[1].toLowerCase() : (unitHint || "");
      };
      const unit = unitFrom(provided) || unitFrom(required) || unitHint || "";
      const req = String(required);
      if (u !== null && Number.isFinite(u) && u > 1 && pN && rN) {
        const pv = Number(pN[0]), rv = Number(rN[0]);
        if (Number.isFinite(pv) && Number.isFinite(rv)) {
          if (/≥|>=/.test(req) || /min/i.test(req)) {
            const d = rv - pv;
            if (d > 0) return fmt(d, 3) + (unit ? " " + unit : "") + " short";
          }
          if (/≤|<=/.test(req) || /max/i.test(req)) {
            const d = pv - rv;
            if (d > 0) return fmt(d, 3) + (unit ? " " + unit : "") + " over";
          }
          // stress / capacity style: provided > limit
          if (unit === "ksi" || unit === "t" || unit === "lb") {
            const d = pv - rv;
            if (d > 0) return fmt(d, 3) + " " + unit + " over";
          }
          // R range: R below R_min
          if (rN.length >= 2 && /–|-/.test(req)) {
            const lo = Number(rN[0]), hi = Number(rN[1]), R = Number(pN[0]);
            if (R < lo) return fmt(lo - R, 3) + " in short of Rmin";
            if (R > hi) return fmt(R - hi, 3) + " in over Rmax";
          }
          const d = Math.abs(pv - rv);
          return fmt(d, 3) + (unit ? " " + unit : "");
        }
      }
      if (u === Infinity) {
        if (pN && rN) {
          const pv = Number(pN[0]), rv = Number(rN[0]);
          if (Number.isFinite(pv) && Number.isFinite(rv) && /≥|>=/.test(req))
            return fmt(rv - pv, 3) + (unit ? " " + unit : "") + " short";
        }
        return "gap closed";
      }
      return "does not meet";
    }

    function buildGapRows() {
      if (mode !== "check" || !score) return { rows: [], allPass: false, margin: null, blocked: true };
      const rows = [];
      const add = (name, provided, required, uc, ok, unit) => {
        const u = (uc === null || uc === undefined) ? null : Number(uc);
        let pct = "";
        if (u !== null && Number.isFinite(u)) pct = ((u - 1) * 100).toFixed(1) + "%";
        else if (u === Infinity) pct = "∞";
        let delta;
        if (ok) {
          // margin: how much spare vs limit
          if (u !== null && Number.isFinite(u)) {
            const spare = 1 - u;
            delta = spare >= 0
              ? ((spare * 100).toFixed(1) + "% margin")
              : plainShortfall(provided, required, u, unit);
          } else {
            delta = "ok";
          }
        } else {
          delta = plainShortfall(provided, required, u, unit);
        }
        rows.push({ name, provided, required, uc: u, delta, pct, ok: !!ok });
      };
      // Parse fit text into provided/required/uc (same as before)
      const parseFit = (f) => {
        const tx = f.text || "";
        let provided = tx, required = "", uc = null;
        const m = (re) => tx.match(re); let k;
        if ((k = m(/^Dh ([\d.]+) >= ([\d.]+)/))) { provided = k[1] + " in"; required = "≥ " + k[2] + " in"; uc = Number(k[2]) / Number(k[1]); }
        else if ((k = m(/^Dh ([\d.]+) <= ([\d.]+)/))) { provided = k[1] + " in"; required = "≤ " + k[2] + " in"; uc = Number(k[1]) / Number(k[2]); }
        else if ((k = m(/= ([\d.]+) <= A ([\d.]+)/))) { provided = k[1] + " in"; required = "≤ " + k[2] + " in"; uc = Number(k[1]) / Number(k[2]); }
        else if ((k = m(/= ([\d.]+) >= 0.75 A = ([\d.]+)/))) { provided = k[1] + " in"; required = "≥ " + k[2] + " in"; uc = Number(k[2]) / Number(k[1]); }
        else if ((k = m(/Gap_min ([-\d.]+) >= tolerance ([\d.]+)/))) { provided = k[1] + " in"; required = "≥ " + k[2] + " in"; uc = Number(k[1]) > 0 ? Number(k[2]) / Number(k[1]) : (Number(k[2]) > 0 || Number(k[1]) < 0 ? Infinity : 0); }
        else if ((k = m(/R_min ([\d.]+).*<= R ([\d.]+).*<= R_max ([-\d.]+)/))) {
          provided = k[2] + " in"; required = k[1] + "–" + k[3] + " in";
          uc = Math.max(Number(k[1]) / Number(k[2]), Number(k[3]) > 0 ? Number(k[2]) / Number(k[3]) : Infinity);
        }
        else if ((k = m(/^Rc ([\d.]+) <= R ([\d.]+)/))) { provided = k[1] + " in"; required = "≤ " + k[2] + " in"; uc = Number(k[1]) / Number(k[2]); }
        else if ((k = m(/bow dia D ([\d.]+) <= thimble D ([\d.]+); thimble width E ([\d.]+) <= bow inside E ([\d.]+)/))) {
          provided = "D " + k[1] + " E " + k[3] + " in"; required = "D ≤ " + k[2] + ", E ≤ " + k[4] + " in";
          uc = Math.max(Number(k[1]) / Number(k[2]), Number(k[3]) / Number(k[4]));
        }
        else if ((k = m(/sling ([\d.]+) deg.*<= ([\d.]+)/))) { provided = k[1] + " deg"; required = "≤ " + k[2] + " deg"; uc = Number(k[1]) / Number(k[2]); }
        else if (/no cheek/i.test(tx)) { provided = "none"; required = "—"; uc = 0; }
        return { provided, required: required || "see values", uc };
      };

      if (score.block) return { rows: [], allPass: false, margin: null, blocked: true };

      (score.rows || []).forEach((r) => {
        add(chipName(r.name), fmt(r.value, 3), fmt(r.limit, 3), r.util, r.ok, "ksi");
      });
      if (checkLs) {
        const ls = checkLs;
        if (ls.leg) add("Rope WLL", fmt(ls.leg.util * ls.leg.wll_lb, 0) + " lb", fmt(ls.leg.wll_lb, 0) + " lb", ls.leg.util, ls.leg.util <= 1 && !ls.leg.too_small, "lb");
        if (ls.master_link) add("Master link WLL", fmt(ls.master_link.util * ls.master_link.wll_lb, 0) + " lb", fmt(ls.master_link.wll_lb, 0) + " lb", ls.master_link.util, ls.master_link.util <= 1, "lb");
        if (ls.forerunner) add("Forerunner WLL", fmt(ls.forerunner.util * ls.forerunner.wll_lb, 0) + " lb", fmt(ls.forerunner.wll_lb, 0) + " lb", ls.forerunner.util, ls.forerunner.util <= 1, "lb");
        if (ls.shackle) add("Shackle WLL", fmt(ls.wll_req_t, 3) + " t", fmt(ls.shackle.wll_dnv, 3) + " t", ls.shackle.utilisation, ls.shackle.utilisation <= 1, "t");
      }
      (score.fits || []).forEach((f) => {
        const p = parseFit(f);
        add(chipName(f.name), p.provided, p.required, p.uc, f.ok, "in");
      });

      const ucs = rows.map((r) => r.uc).filter((u) => typeof u === "number" && Number.isFinite(u));
      const margin = ucs.length ? Math.min(...ucs.map((u) => 1 - u)) : null;
      const allPass = rows.length > 0 && rows.every((r) => r.ok);
      return { rows, allPass, margin, blocked: false };
    }

    function paintGapReport() {
      const host = document.getElementById("gapReport");
      if (!host) return;
      paintPrintMeta();
      if (mode !== "check") { host.hidden = true; host.innerHTML = ""; return; }
      host.hidden = false;
      const g = buildGapRows();
      if (g.blocked) {
        host.innerHTML = `<h2>Gap report</h2><p class="gapfail">Not scored: ${esc((score && score.block) || "blocked")}</p>`;
        return;
      }
      if (!g.rows.length) {
        host.innerHTML = `<h2>Gap report</h2><div class="gapok">No checks to report.</div>`;
        return;
      }
      const head = `<h2>Gap report</h2><table><tr><th>Check</th><th>Provided</th><th>Required</th><th>UC</th><th>Margin / shortfall</th><th>Status</th></tr>`;
      const body = g.rows.map((r) => {
        const u = r.uc == null ? "" : Number.isFinite(r.uc) ? fmt(r.uc, 3) : "∞";
        return `<tr class="${r.ok ? "" : "bad"}"><td>${esc(r.name)}</td><td class="num">${esc(String(r.provided))}</td><td class="num">${esc(String(r.required))}</td><td class="num">${u}</td><td class="num">${esc(r.delta)}</td><td class="${r.ok ? "" : "gapfail"}">${r.ok ? "PASS" : "FAIL"}</td></tr>`;
      }).join("");
      const foot = g.allPass
        ? `<caption class="gapok" style="caption-side:bottom;text-align:left;padding:4px 0;">No gaps: all checks pass.${g.margin != null && Number.isFinite(g.margin) ? " Smallest margin " + (g.margin * 100).toFixed(1) + "% of limit." : ""}</caption>`
        : "";
      host.innerHTML = head + body + "</table>" + foot;
    }

    function tables() {
      const checks = document.getElementById("checks");
      const fits = document.getElementById("fits");
      const shWll = (mode === "design" && designed && designed.ls && designed.ls.shackle)
        ? [{ name: "Shackle WLL, WLLs vs SWL (t)", value: designed.ls.wll_req_t, limit: designed.ls.shackle.wll_dnv, util: designed.ls.shackle.utilisation, ok: designed.ls.shackle.utilisation <= 1 }]
        : (mode === "check" && checkLs && checkLs.shackle)
          ? [{ name: "Shackle WLL, WLLs vs SWL (t)", value: checkLs.wll_req_t, limit: checkLs.shackle.wll_dnv, util: checkLs.shackle.utilisation, ok: checkLs.shackle.utilisation <= 1 }]

        (score.fits || []).map(row => `<tr class="${row.ok ? "" : "bad"}"><td>${row.name}</td><td>${row.text}</td><td>${row.ok ? "Pass" : "Fail"}</td></tr>`).join("");
      const pass = score.pass === true;

        ? `<div class="stat big bad"><b class="fail">FAIL</b><span>Not scored: ${score.block}</span></div>`
        : `<div class="stat big${pass ? "" : " bad"}"><b class="${pass ? "pass" : "fail"}">${pass ? "PASS" : "FAIL"}</b><span>Plate and fits</span></div>

           <div class="stat"><b>${fmt(score.rsl, 3)}</b><span>Design load RSL, lb</span></div>`;
